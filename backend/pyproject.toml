[project]
name = "exam-sim-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.3.0",
    "authlib>=1.9.1",
    "cryptography>=50.0.2",
    "docling>=2.144.0",
    "fastapi[standard]>=0.162.0",
    "fastembed>=0.9.1",
    "genanki>=0.13.1",
    "google-genai>=2.34.0",
    "itsdangerous>=2.2.0",
    "mcp>=2.3.0",
    "mlx-vlm>=0.7.11 ; platform_machine == 'arm64' and sys_platform == 'darwin'",
    "openai>=3.41.0",
    "pdfplumber>=0.11.9",
    "pgvector>=0.5.1",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.3.6",
    "pypdfium2==4.30.0",  # pinned by surya-ocr
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.6",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
filterwarnings = [
    # docling serialises its own default OCR options; remove when an upgrade stops emitting it
    "ignore:`force_full_page_ocr` is deprecated:DeprecationWarning",
    # docling reads its own generate_table_images; remove when an upgrade stops emitting it
    "ignore:This field is deprecated. Use `generate_page_images=True`:DeprecationWarning",
    # transformers reads a bundled model config; remove when an upgrade stops emitting it
    "ignore:`rope_scaling` is deprecated:FutureWarning",
]

[tool.ruff]
line-length = 150
target-version = "py313"

[tool.ruff.lint]
ignore = [
    "B008",  # FastAPI's Depends(...) defaults
    "BLE001",  # broad excepts here are deliberate fallbacks
    "C408",  # dict(...) calls are fine
]
